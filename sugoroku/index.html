<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>人生ゲーム風ミニゲーム</title>
  <!-- Google Analytics 4 -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MR9M66JF6J"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MR9M66JF6J');
  </script>
  <link rel="stylesheet" href="style.css?v=18">
</head>
<body>
  <main class="game">
    <h1>人生ゲーム風ミニゲーム</h1>

    <section class="status">
      <div>
        <span class="label">現在地</span>
        <strong id="positionText">スタート</strong>
      </div>
      <div>
        <span class="label">休み回数</span>
        <strong id="restText">0</strong>
      </div>
    </section>

    <section class="dice-area">
      <button id="rollButton" type="button">サイコロを振る</button>
      <button id="restartButton" class="restart-button" type="button">もう一度</button>
      <div class="dice-track"><img id="diceImage" src="assets/dice1.png?v=7" alt="サイコロの出目 1"></div>
    </section>

    <p id="message" class="message">サイコロを振ってスタート！</p>

    <section id="board" class="board" aria-label="ゲーム盤"></section>
    <div id="goalEffect" class="goal-effect" aria-hidden="true">ゴール！🎉</div>
  </main>

  <nav class="game-back-nav" aria-label="Note navigation">
    <a class="exit-door-btn" href="../index.html" aria-label="TOPへ戻る">
      <div class="exit-door-scene">
        <svg class="exit-door-frame" width="170" height="200" viewBox="0 0 170 200" aria-hidden="true" focusable="false">
          <path d="M 40 184 L 40 12 L 124 12 L 124 184" fill="none" stroke="#454b5a" stroke-width="5"/>
        </svg>
        <svg class="exit-door-panel" width="76" height="158" viewBox="0 0 76 158" aria-hidden="true" focusable="false">
          <defs>
            <clipPath id="exitDoorClip"><rect x="0" y="0" width="76" height="158" rx="1"/></clipPath>
          </defs>
          <rect x="0" y="0" width="76" height="158" rx="1" fill="#4d5465" stroke="#3d4252" stroke-width="1.5"/>
          <g clip-path="url(#exitDoorClip)" opacity="0.55">
            <ellipse cx="26" cy="32" rx="26" ry="18" fill="#565d6e"/>
            <ellipse cx="54" cy="77" rx="22" ry="26" fill="#454b5a"/>
            <ellipse cx="21" cy="122" rx="24" ry="20" fill="#555c6d"/>
            <ellipse cx="44" cy="44" rx="14" ry="10" fill="#454b5a"/>
            <ellipse cx="58" cy="132" rx="18" ry="14" fill="#565d6e"/>
            <ellipse cx="14" cy="74" rx="12" ry="16" fill="#525968"/>
          </g>
          <rect x="70" y="24" width="4" height="18" rx="1" fill="#9aa0aa"/>
          <rect x="70" y="118" width="4" height="18" rx="1" fill="#9aa0aa"/>
          <circle cx="12" cy="70" r="3" fill="#c5c9d0" stroke="#8a8f99" stroke-width="0.8"/>
          <rect x="7" y="78" width="13" height="5.5" rx="2.5" fill="#c5c9d0" stroke="#8a8f99" stroke-width="0.8"/>
        </svg>
      </div>
      <span class="exit-door-label">EXIT</span>
    </a>
  </nav>

  <script src="script.js?v=10"></script>
</body>
</html>
